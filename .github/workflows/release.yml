name: Test and build

# Every push and pull request runs the tests and builds both apps. A v* tag also
# attaches the macOS DMG and Windows zip to a draft GitHub release for review.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen  # unit tests build Qt objects without a display

jobs:
  macos:
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-macos.lock.txt
          python -m pip install -r requirements-macos-build.txt
      - name: Unit tests
        run: python check_core.py
      - name: Build app and DMG
        run: python build_macos_app.py --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: .mac-build/dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-windows-build.txt
      - name: Unit tests
        run: python check_core.py
      - name: Build app and zip
        run: python build_windows_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: .win-build/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "phosphor ${GITHUB_REF_NAME#v}" --generate-notes
